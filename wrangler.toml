name = "afinapp"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Binding nativo primario para Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "afinapp-db"
database_id = "deb3fa78-4981-4c54-bd97-5db71eceeb4e"

# Alias secundario de compatibilidad
[[d1_databases]]
binding = "AFINAPP_DB"
database_name = "afinapp-db"
database_id = "deb3fa78-4981-4c54-bd97-5db71eceeb4e"
