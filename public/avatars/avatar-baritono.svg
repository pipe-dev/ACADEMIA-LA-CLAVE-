<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-bari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hair-bari" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-bari)" stroke="#fde68a" stroke-width="2" />

  <!-- Shoulders & Denim/T-shirt -->
  <path d="M 28 116 C 30 92, 45 84, 60 84 C 75 84, 90 92, 92 116 Z" fill="#1e3a8a" />
  <circle cx="60" cy="88" r="8" fill="#e0e7ff" />

  <!-- Neck -->
  <rect x="54" y="70" width="12" height="18" rx="6" fill="#fde68a" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="56" rx="21" ry="22" fill="#fef08a" />

  <!-- Stylish trimmed beard -->
  <path d="M 43 56 C 43 76, 77 76, 77 56 C 77 64, 73 78, 60 78 C 47 78, 43 64, 43 56 Z" fill="url(#hair-bari)" />

  <!-- Ears -->
  <circle cx="39" cy="56" r="4.5" fill="#fef08a" />
  <circle cx="81" cy="56" r="4.5" fill="#fef08a" />

  <!-- Hair pompadour -->
  <path d="M 39 46 C 39 26, 81 24, 82 44 C 76 34, 66 32, 60 30 C 50 32, 43 36, 39 46 Z" fill="url(#hair-bari)" />
  <ellipse cx="60" cy="30" rx="14" ry="7" fill="url(#hair-bari)" />

  <!-- Confident expressive eyes (one winking or friendly grin) -->
  <circle cx="49" cy="50" r="3" fill="#1c1917" />
  <circle cx="50" cy="49" r="1" fill="#fff" />
  <circle cx="71" cy="50" r="3" fill="#1c1917" />
  <circle cx="72" cy="49" r="1" fill="#fff" />

  <!-- Eyebrows -->
  <path d="M 44 44 Q 50 41 55 45" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 65 45 Q 70 41 76 44" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Big smile with white teeth -->
  <path d="M 52 62 Q 60 70 68 62 Z" fill="#fff" stroke="#1c1917" stroke-width="1.5" />

  <!-- Studio Red Headphones -->
  <path d="M 36 52 C 36 32, 84 32, 84 52" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <rect x="33" y="47" width="7" height="15" rx="3.5" fill="#dc2626" />
  <rect x="80" y="47" width="7" height="15" rx="3.5" fill="#dc2626" />
</svg>
