<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-armo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="hair-armo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-armo)" stroke="#67e8f9" stroke-width="2" />

  <!-- Singing music vibe sparks -->
  <circle cx="28" cy="38" r="2.5" fill="#fef08a" opacity="0.8" />
  <circle cx="94" cy="36" r="3" fill="#fef08a" opacity="0.8" />
  <circle cx="92" cy="74" r="2" fill="#fef08a" opacity="0.6" />

  <!-- Shoulders & Bright shirt -->
  <path d="M 28 116 C 30 92, 45 84, 60 84 C 75 84, 90 92, 92 116 Z" fill="#8b5cf6" />
  <path d="M 52 84 L 60 96 L 68 84 Z" fill="#c4b5fd" />

  <!-- Neck -->
  <rect x="54" y="72" width="12" height="16" rx="6" fill="#fcd34d" opacity="0.3" />
  <rect x="54" y="72" width="12" height="16" rx="6" fill="#fed7aa" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="58" rx="21" ry="23" fill="#fed7aa" />

  <!-- Cheeks glowing with passion -->
  <circle cx="45" cy="64" r="5" fill="#f43f5e" opacity="0.4" />
  <circle cx="75" cy="64" r="5" fill="#f43f5e" opacity="0.4" />

  <!-- Stylized Hair Flow -->
  <path d="M 38 48 C 38 28, 82 28, 84 48 C 76 34, 66 32, 60 34 C 52 32, 44 34, 38 48 Z" fill="url(#hair-armo)" />
  <path d="M 36 48 C 34 62, 38 72, 42 76 C 40 68, 38 58, 40 50 Z" fill="url(#hair-armo)" />
  <path d="M 84 48 C 86 62, 82 72, 78 76 C 80 68, 82 58, 80 50 Z" fill="url(#hair-armo)" />

  <!-- Eyes closed singing with pure joy -->
  <path d="M 45 54 Q 50 59 55 54" stroke="#431407" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 65 54 Q 70 59 75 54" stroke="#431407" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Eyebrows -->
  <path d="M 45 47 Q 50 43 55 47" stroke="#881337" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 65 47 Q 70 43 75 47" stroke="#881337" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Big singing 'O' mouth -->
  <ellipse cx="60" cy="67" rx="6" ry="7" fill="#be123c" />
  <ellipse cx="60" cy="65" rx="4" ry="2" fill="#fff" />
</svg>
