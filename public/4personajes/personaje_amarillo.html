<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personaje Amarillo - Exacto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f2f4;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Escenario y soporte */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 25px;
    }

    /* 1. Sombras de apoyo en el suelo */
    .shadow-ambient {
      position: absolute;
      bottom: 18px;
      width: 210px;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(60, 50, 10, 0.22) 0%, rgba(60, 50, 10, 0.05) 55%, transparent 75%);
      filter: blur(7px);
      border-radius: 50%;
      z-index: 1;
    }

    .shadow-contact {
      position: absolute;
      bottom: 23px;
      width: 176px;
      height: 14px;
      background: rgba(45, 35, 8, 0.45);
      filter: blur(2px);
      border-radius: 50%;
      z-index: 2;
    }

    /* 2. Cuerpo: cilindro con domo superior */
    .yellow-char {
      position: relative;
      z-index: 3;
      width: 176px;
      height: 295px;
      /* Domo superior perfecto y base cortada recta */
      border-radius: 88px 88px 12px 12px;
      clip-path: path("M 88 0 Q 176 0 176 88 C 176 150 174 210 175 250 C 175.5 275 176 288 174 295 L 2 295 C 0 288 0.5 275 1 250 C 2 210 0 150 0 88 Q 0 0 88 0 Z");
      background: linear-gradient(
        96deg,
        #fbe674 0%,
        #f6da56 16%,
        #eed045 45%,
        #e3c333 75%,
        #cba71e 96%,
        #be9b16 100%
      );
      box-shadow:
        inset 0 8px 10px rgba(255, 255, 255, 0.6),
        inset 6px 0 9px rgba(255, 255, 255, 0.22),
        inset -8px 0 12px rgba(140, 105, 5, 0.25),
        inset 0 -10px 14px rgba(110, 80, 5, 0.35),
        0 16px 22px -6px rgba(70, 55, 10, 0.16);
      overflow: visible;
    }

    /* Brillo difuso en la cúpula */
    .yellow-char::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 14px;
      right: 14px;
      height: 70px;
      border-radius: 80px 80px 20px 20px;
      background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.45) 0%, transparent 70%);
      pointer-events: none;
    }

    /* 3. Rostro */
    .face {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateY(-65px);
    }

    /* Ojo izquierdo */
    .eye-left {
      position: absolute;
      top: 131px;
      left: 4px;
      width: 10px;
      height: 6px;
      background: #111114;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* Ojo derecho */
    .eye-right {
      position: absolute;
      top: 131px;
      right: 30px;
      width: 10px;
      height: 6px;
      background: #111114;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    /* Boca recta seria */
    .mouth-line {
      position: absolute;
      top: 162px;
      left: 14px;
      width: 114px;
      height: 6.5px;
      background: #121118;
      border-radius: 4px;
      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.3),
        0 1px 1px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="shadow-ambient"></div>
    <div class="shadow-contact"></div>

    <div class="yellow-char">
      <div class="face">
        <div class="eye-left"></div>
        <div class="eye-right"></div>
        <div class="mouth-line"></div>
      </div>
    </div>
  </div>

</body>
</html>
