<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personaje Morado - Exacto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f2f4;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    /* Sombras de apoyo en el suelo */
    .shadow-ambient {
      position: absolute;
      bottom: 25px;
      width: 280px;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(30, 20, 50, 0.22) 0%, rgba(30, 20, 50, 0.05) 55%, transparent 75%);
      filter: blur(8px);
      border-radius: 50%;
      z-index: 1;
    }

    .shadow-contact {
      position: absolute;
      bottom: 35px;
      width: 230px;
      height: 12px;
      background: rgba(20, 10, 35, 0.35);
      filter: blur(3px);
      border-radius: 50%;
      z-index: 2;
    }

    /* Cuerpo del personaje morado */
    .purple-char {
      position: relative;
      z-index: 3;
      width: 250px;
      height: 400px;
      border-radius: 46px 46px 18px 18px;
      clip-path: path("M 46 0 L 204 0 Q 250 0 250 46 C 249 110 245 190 247 270 C 249 320 250 360 250 382 Q 250 400 232 400 L 18 400 Q 0 400 0 382 C 0 360 1 320 3 270 C 5 190 1 110 0 46 Q 0 0 46 0 Z");
      background: linear-gradient(
        180deg,
        #8254d8 0%,
        #7949cf 15%,
        #7544c8 50%,
        #6e3dc0 85%,
        #6433b2 100%
      );
      box-shadow:
        inset 0 6px 8px rgba(255, 255, 255, 0.42),
        inset 5px 0 8px rgba(255, 255, 255, 0.18),
        inset -7px 0 10px rgba(40, 15, 80, 0.25),
        inset 0 -10px 14px rgba(25, 10, 60, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rostro */
    .face {
      position: absolute;
      top: 20px;
      transform: translateX(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .eyes {
      display: flex;
      gap: 62px;
    }

    /* Ojos: esferas blancas redondas 3D */
    .eye {
      width: 23px;
      height: 16px;
      background: radial-gradient(
        circle at 62% 38%,
        #ffffff 0%,
        #fcfbfe 45%,
        #eae6f2 78%,
        #d5cee0 100%
      );
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        2px 3px 5px rgba(20, 10, 45, 0.45),
        4px 7px 18px rgba(20, 10, 45, 0.15),
        3px 5px 30px rgba(20, 10, 45, 0.09),
        inset 1px -1px 2px rgba(255, 255, 255, 0.8),
        inset -1.5px 2px 3px rgba(100, 65, 150, 0.22);
      position: relative;
      overflow: hidden;
    }

    /* Pupila */
    .pupil {
      width: 8px;
      height: 5.6px;
      background: #121016;
      border-radius: 50%;
    }

    /* Boca: linea con forma de banana y sombra proyectada */
    .mouth {
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 1.5px 2.5px rgba(20, 10, 45, 0.35))
              drop-shadow(0 0.5px 1px rgba(20, 10, 45, 0.25));
    }

    .mouth svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="shadow-ambient"></div>
    <div class="shadow-contact"></div>

    <div class="purple-char">
      <div class="face">
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth">
          <svg width="44" height="14" viewBox="-8 0 44 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M -4 3.5 Q 14 9 32 3.2" stroke="#201a26" stroke-width="4.6" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
