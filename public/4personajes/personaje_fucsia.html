<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personaje Fucsia - Exacto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f2f4;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Escenario y soporte */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 30px;
    }

    /* Sombras en el suelo (oclusión ambiental suave) */
    .shadow-ambient {
      position: absolute;
      bottom: 22px;
      width: 190px;
      height: 26px;
      background: radial-gradient(ellipse at center, rgba(60, 10, 30, 0.22) 0%, rgba(60, 10, 30, 0.05) 55%, transparent 75%);
      filter: blur(8px);
      border-radius: 50%;
      z-index: 1;
    }

    .shadow-contact {
      position: absolute;
      bottom: 29px;
      width: 175px;
      height: 10px;
      background: rgba(45, 8, 22, 0.38);
      filter: blur(2.5px);
      border-radius: 50%;
      z-index: 2;
    }

    /* Contenedor del cuerpo */
    .fuchsia-char {
      position: relative;
      z-index: 3;
      width: 190px;
      height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Malla del cuerpo (silueta con inflado orgánico + volumen de luz) */
    .fuchsia-body {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px 20px 10px 10px;
      clip-path: path("M 20 0 Q 0 0 0 20 C 0 110 -4 280 4 395 Q 6 420 20 420 L 170 420 Q 184 420 186 395 C 194 280 190 110 190 20 Q 190 0 170 0 Z");
      background: linear-gradient(
        92deg,
        #d85292 0%,
        #d04583 14%,
        #c73773 40%,
        #c3326d 68%,
        #a82155 96%,
        #9b1b4c 100%
      );
    }

    /* Iluminación cenital y biseles superiores/inferiores */
    .fuchsia-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(255, 255, 255, 0.12) 3%,
        transparent 15%,
        transparent 85%,
        rgba(40, 5, 20, 0.35) 100%
      );
      pointer-events: none;
    }

    /* Rim highlight sutil en el borde izquierdo simulando volumen curvo */
    .fuchsia-body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.25) 30%,
        transparent 90%
      );
      filter: blur(2px);
      pointer-events: none;
    }

    /* Rostro */
    .face {
      position: absolute;
      top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 4;
    }

    .eyes {
      display: flex;
      gap: 16px;
    }

    /* Ojos circulares con volumen propio */
    .eye {
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 2.5px 4px rgba(0, 0, 0, 0.26),
        inset 0 -1px 2px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    /* Pupila oscura */
    .pupil {
      width: 8px;
      height: 8px;
      background: #111116;
      border-radius: 50%;
      position: relative;
    }

    /* Punto especular */
    .pupil::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 2px;
      height: 2px;
      background: #ffffff;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="shadow-ambient"></div>
    <div class="shadow-contact"></div>

    <div class="fuchsia-char">
      <div class="fuchsia-body"></div>
      <div class="face">
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
